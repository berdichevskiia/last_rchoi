<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Team Tasks — Просмотр задач команды</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="container">
        <h1>Team Tasks</h1>
        <p class="subtitle">Удобный интерфейс для просмотра и управления задачами команды</p>
      </div>
    </header>

    <main class="container layout">
      <aside class="sidebar card">
        <h3>Фильтры</h3>
        <label>Статус
          <select id="filterStatus">
            <option value="">Все</option>
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>Исполнитель
          <select id="filterAssignee">
            <option value="">Все</option>
          </select>
        </label>
        <button id="btnRefresh" class="btn">Применить</button>
        <hr/>
        <h3>Добавить задачу</h3>
        <input id="newTitle" placeholder="Название задачи" />
        <textarea id="newDesc" placeholder="Описание"></textarea>
        <select id="newAssignee"><option value="">Без исполнителя</option></select>
        <select id="newPriority">
          <option value="1">High</option>
          <option value="2" selected>Medium</option>
          <option value="3">Low</option>
        </select>
        <button id="btnAdd" class="btn primary">Добавить</button>
      </aside>

      <section class="main card">
        <div class="toolbar">
          <input id="search" placeholder="Поиск по заголовку..." />
          <div class="stats" id="stats"></div>
        </div>
        <div id="tasks" class="tasks"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">Приложение пример — запусти локально: <code>python -m venv .venv &amp;&amp; .venv/bin/activate &amp;&amp; pip install -r requirements.txt &amp;&amp; flask run</code></div>
    </footer>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
